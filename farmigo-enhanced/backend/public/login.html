<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Farmigo</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
<div class="login-page">
  <div class="login-box">
    <div class="login-header">
      <a href="Home.html" class="back-link">← Back</a>
      <h1>🌾 Farmigo</h1>
      <p>Farmers Marketplace</p>
    </div>
    <div class="tab-btns">
      <button onclick="switchForm('login')" class="tab-btn active" id="loginTab">Login</button>
      <button onclick="switchForm('register')" class="tab-btn" id="registerTab">Register</button>
    </div>

    <!-- LOGIN FORM -->
    <form id="loginForm" class="auth-form">
      <div class="form-group">
        <label>Role</label>
        <select id="loginRole" required>
          <option value="">Select role</option>
          <option value="seller">Seller (Farmer)</option>
          <option value="buyer">Buyer</option>
        </select>
      </div>
      <div class="form-group">
        <label>Email or Mobile</label>
        <input type="text" id="loginEmail" placeholder="Enter email or mobile" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="Enter password" required>
      </div>
      <div id="loginMsg" class="msg hidden"></div>
      <button type="submit" class="submit-btn">Login</button>
    </form>

    <!-- REGISTER FORM -->
    <form id="registerForm" class="auth-form hidden">
      <div class="form-group">
        <label>Role</label>
        <select id="regRole" required onchange="toggleRegFields()">
          <option value="">Select role</option>
          <option value="seller">Seller (Farmer)</option>
          <option value="buyer">Buyer</option>
        </select>
      </div>
      <div style="display:flex;gap:10px">
        <div class="form-group" style="flex:1">
          <label>First Name</label>
          <input type="text" id="regFirst" placeholder="First" required>
        </div>
        <div class="form-group" style="flex:1">
          <label>Last Name</label>
          <input type="text" id="regLast" placeholder="Last" required>
        </div>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="regEmail" placeholder="Enter email" required>
      </div>
      <div class="form-group">
        <label>Mobile</label>
        <input type="text" id="regMobile" placeholder="10-digit mobile" required>
      </div>
      <div class="form-group">
        <label>City</label>
        <input type="text" id="regCity" placeholder="City">
      </div>
      <div class="form-group">
        <label>State</label>
        <input type="text" id="regState" placeholder="State">
      </div>
      <div class="form-group" id="plotField">
        <label>Plot / Farm No. (Sellers only)</label>
        <input type="text" id="regPlotNo" placeholder="e.g. Plot 45, Village Rampur">
      </div>
      <div class="form-group" id="aadhaarField" style="display:none">
        <label>Aadhaar / Licence No. (Buyers only)</label>
        <input type="text" id="regAadhaar" placeholder="Aadhaar or Licence number">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="regPassword" placeholder="Create password" required>
      </div>
      <div id="regMsg" class="msg hidden"></div>
      <button type="submit" class="submit-btn">Create Account</button>
    </form>
  </div>
</div>
<script src="first.js"></script>
</body>
</html>
